name: Build and Release Windows Executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install FFmpeg
        run: choco install ffmpeg

      - name: Run automated tests
        run: |
          python -m pytest tests -v

      - name: Build Windows Executable
        run: |
          python packaging/build_windows.py

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Online Subtitle Generator/*" -DestinationPath "Online-Subtitle-Generator-Portable.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Online-Subtitle-Generator-Windows-Portable
          path: Online-Subtitle-Generator-Portable.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          files: Online-Subtitle-Generator-Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
