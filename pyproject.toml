[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onlinesubtitlegenerator"
version = "1.0.10"
authors = [{ name = "OnlineSub" }]
description = "High-performance AI Subtitle Generator Windows Desktop Application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.8.0",
    "psutil>=6.0.0",
    "keyring>=24.0.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
onlinesub = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
